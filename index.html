                <div class="space-y-6 text-gray-700">
                    <div>
                        <h3 class="text-lg font-bold text-gray-900 mb-2">Purpose of the Study</h3>
                        <p class="leading-relaxed">The purpose of this research is to evaluate and compare the user experience of a traditional manual wardrobe creation workflow against an AI-assisted wardrobe creation workflow. We aim to understand which method is more usable, efficient, and preferred by users.</p>
                    </div>

                    <div>
                        <h3 class="text-lg font-bold text-gray-900 mb-2">Why have I been invited?</h3>
                        <p class="leading-relaxed">You have been invited because you are 18 years of age or older. We are seeking general users to understand how different demographics interact with wardrobe applications.</p>
                    </div>

                        <p class="leading-relaxed">You will complete two brief digital wardrobe activities (one traditional, one AI-assisted), complete a short demographic questionnaire, and provide your evaluation of both workflows through a post-study questionnaire.</p>
                    </div>

                        <p class="leading-relaxed">Participation is completely voluntary. You have the right to withdraw from the study at any time without providing a reason by simply closing your browser tab.</p>

                    <div class="space-y-4 text-gray-700">
                        <p>Thank you for taking part in this research study. Your participation is greatly appreciated.</p>
                        <p><strong class="text-gray-900">Nature of research:</strong> This study explored how users interact with and perceive two different digital wardrobe recommendation workflows: a traditional manual workflow and an AI-assisted workflow. Participants completed both workflows to compare their usability, interaction experience, perceived usefulness, confidence, and overall preference.</p>
                        <p>The traditional workflow required participants to manually create a complete digital wardrobe before receiving outfit recommendations. This represents the approach commonly used by existing wardrobe applications. The AI-assisted workflow was designed to reduce the effort required by automatically recognising clothing items from images, while allowing users to review and correct any errors.</p>
                        <p>The findings from this study will contribute to research on artificial intelligence, user experience design, and digital wardrobe recommendation systems.</p>
                        <p><strong class="text-gray-900">Your Data:</strong> Your data will be handled as described in the Participant Information Sheet and Consent Form (EMS12334). All responses are anonymous, securely stored, and accessible only to the researcher and project supervisors. If you wish to withdraw your data, you may do so before data analysis begins.</p>
                        <p><strong class="text-gray-900">Sources of Support:</strong> If taking part in this study has raised any concerns or caused any distress, you may contact Abertay University Student Counselling and Support Services (<a href="https://www.abertay.ac.uk/life/student-support-and-services/counselling/" class="text-primary underline" target="_blank">Website</a>). Alternatively, you may wish to contact your GP or another appropriate support service.</p>
